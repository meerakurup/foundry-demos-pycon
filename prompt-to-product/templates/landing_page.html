<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product_name }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #eee;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 680px;
            width: 100%;
            overflow: hidden;
        }
        .hero {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: #f5f5f5;
        }
        .hero-placeholder {
            width: 100%;
            height: 320px;
            background: linear-gradient(135deg, #7B2D8E, #C084FC);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .hero-placeholder .pattern {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            background-image:
                radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, white 1px, transparent 1px),
                radial-gradient(circle at 60% 80%, white 1.5px, transparent 1.5px);
            background-size: 60px 60px, 80px 80px, 50px 50px;
        }
        .hero-placeholder .label {
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            font-weight: 500;
        }
        .content {
            padding: 2.5rem;
        }
        .tagline {
            color: #7B2D8E;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 0.75rem;
            line-height: 1.15;
        }
        .description {
            font-size: 1rem;
            color: #666;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .features {
            list-style: none;
            margin-bottom: 2rem;
        }
        .features li {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f5f0f8;
            color: #333;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .features li:last-child { border-bottom: none; }
        .features li::before {
            content: "✦";
            color: #7B2D8E;
            font-size: 0.9rem;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #7B2D8E, #9B59B6);
            color: white;
            padding: 0.85rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            border: none;
        }
        .cta-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(123, 45, 142, 0.3);
        }
        .footer {
            text-align: center;
            padding: 1.25rem;
            color: #bbb;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div>
        <div class="card">
            {% if image_url %}
            <img class="hero" src="{{ image_url }}" alt="{{ product_name }}">
            {% else %}
            <div class="hero-placeholder">
                <div class="pattern"></div>
                <span class="label">{{ product_name }}</span>
            </div>
            {% endif %}
            <div class="content">
                <div class="tagline">{{ tagline }}</div>
                <h1>{{ product_name }}</h1>
                <p class="description">{{ description }}</p>
                <ul class="features">
                    {% for feature in features %}
                    <li>{{ feature }}</li>
                    {% endfor %}
                </ul>
                <button class="cta-button">{{ cta }}</button>
            </div>
        </div>
        <div class="footer">
            Generated with GPT-5.4 + MAI-Image-2e on Azure AI Foundry
        </div>
    </div>
</body>
</html>
